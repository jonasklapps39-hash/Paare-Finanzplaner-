name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android – Tests & Debug-Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew :core:domain:jvmTest :shared:testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: paarfinanz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  ios:
    name: iPhone – Tests & Simulator-Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin-Tests im iOS-Simulator
        run: ./gradlew :core:domain:iosSimulatorArm64Test :shared:iosSimulatorArm64Test --stacktrace

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: App für den Simulator bauen (ohne Signatur)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'

  database:
    name: Supabase – Migrationen & RLS-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Migrationen einspielen und Tests ausführen
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run_tests.sh
