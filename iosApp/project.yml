# Xcode-Projekt für die iPhone-App. Erzeugen mit: cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: de.paarfinanz
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Paarfinanz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # paarfinanz://invite/CODE (QR-Code) und paarfinanz://login (Bestätigungsmails)
        CFBundleURLTypes:
          - CFBundleURLName: de.paarfinanz.app
            CFBundleURLSchemes: [paarfinanz]
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: Paarfinanz
        PRODUCT_BUNDLE_IDENTIFIER: de.paarfinanz.app
        CODE_SIGN_STYLE: Automatic
        # Eigenes Apple-Team hier oder in Xcode unter "Signing & Capabilities" eintragen.
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Kotlin-Code bauen (shared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
